[package]
name = "trama-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Trama command line: info, export, convert, render, scripted commands, MCP server, perf"

[[bin]]
name = "trama-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
trama-engine = { workspace = true }
trama-doc = { workspace = true }
trama-render = { workspace = true }
trama-text = { workspace = true }
trama-svg = { workspace = true }
trama-format = { workspace = true }
trama-mcp = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# 4.6 breaks Bash subcommand completion for hyphenated binary names (clap-rs/clap#6421).
clap_complete = "~4.5.67"
clap_mangen = "0.3"
