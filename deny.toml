# Licence check for every crate Trama builds (`cargo deny check licenses`, run by CI). The list is
# Foundation's allowlist (getnodalia/foundation standards/dependencies.md) plus the permissive
# licences some Rust crates use; anything else needs Daniel's approval first.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # webpki-roots: the Mozilla root certificates, as data.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    # The fonts egui embeds by default (epaint_default_fonts).
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]
