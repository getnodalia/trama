name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# reusable gate workflow in getnodalia/foundation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: getnodalia/foundation/.github/workflows/rust-gate.yml@a5325485b557dca4040002a0120a06d72b10ccb5 # foundation main
    with:
      # Same nodalia-fonts commit as the release-*.yml workflows.
      fonts-repository: getnodalia/foundation
      fonts-ref: 88274003be6d70de78d6858cbbd6843e1c178b50
      timeout-minutes: 120
      # Inter and Noto Sans Georgian are required by the web build's font allowlist.
      env: |
        NODALIA_FONTS_REQUIRED=1
      free-disk-space: true
      targets: wasm32-unknown-unknown
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev libgtk-3-dev

  # Every git dependency in Cargo.lock comes from getnodalia or nodalia-design.
  git-sources:
    name: git-sources
    uses: getnodalia/foundation/.github/workflows/git-sources.yml@4debdfe28cf5820d1748864efbd8d6996922d1ac # foundation main

  # Every crate's licence is on Foundation's allowlist (deny.toml).
  licences:
    name: Licences
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.18.9
      - run: cargo deny --locked check licenses

  # Trama's own names everywhere; upstream's arrive renamed by the weekly sync.
  names:
    name: No upstream names
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/rebrand.py check
