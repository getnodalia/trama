# What `scripts/rebrand.py` renames: upstream's FigCraft becomes Trama, in file contents and in
# paths. The weekly upstream sync applies the same rules to upstream's tree before merging it, so
# a rule added here applies to everything upstream sends from then on.
#
# Replacements are literal and case-sensitive, applied in order: put the longer, more specific
# ones first. Keep spans are found before any replacement, so a replacement never reaches inside
# one.

# Left as they are wherever they appear (in file contents and in paths).
keep = [
    # Links to upstream's issues, pull requests and commits: history, not branding.
    "(https?://)?github\\.com/storytold/[\\w.-]+/(issues|pull|commit|discussions)/[^\\s)\\]\"'<>`]*",
    # Links to other people's repositories. Upstream's own repository and the shared crates that
    # getnodalia/foundation vendors (craft-libs, egui, winit, craft-fonts) are renamed below.
    "https?://(github\\.com|raw\\.githubusercontent\\.com)/(?!storytold/(figcraft|craft-libs|egui|winit|craft-fonts)\\b|getnodalia|danielmigueltejedor)[^\\s)\\]\"'<>`]*",
    # Upstream's issues named without a link (`storytold/figcraft#123`).
    "storytold/[\\w.-]+#\\d+",
    # The shared test corpus keeps its name.
    "photocraft-corpus",
    # Upstream's repository in the sync workflow and in the record of what came from it.
    "(?<=UPSTREAM_REPO: )storytold/figcraft",
    # The native file's signature, `"format": "figcraft"`: files saved before the rename are read
    # by it, and files Trama saves stay readable by older versions. The extension is renamed (files
    # under the old one keep opening, `trama_format::OLDER_EXTENSIONS`).
    '(?<=FORMAT: &str = ")figcraft(?=")',
    '(?:(?<=format\\":\\")|(?<=format\\": \\")|(?<=format":")|(?<=format": "))figcraft(?=\\?")',
    # The plugin ABI: compiled plugins import host functions from the `figcraft` module and export
    # `figcraft_run`. Renaming either would break every plugin already built.
    '(?<=IMPORT_MODULE: &str = ")figcraft(?=")',
    '(?<=wasm_import_module = ")figcraft(?=")',
    '(?:(?<=import ")|(?<=import \\"))figcraft(?=\\?")',
    "figcraft_run",
    # The plugin manifest's old file name, still read (`trama_engine::extensions::plugins`).
    "(?<=LEGACY_MANIFEST: &str = \")figcraft-plugin\\.json",
    # Data Trama writes into exported .fig files to restore its strokes when they come back.
    '(?<=STASH: \(&str, &str\) = \(")figcraft(?=")',
    '(?<=as_str\(\)\), \(Some\(")figcraft(?=")',
    # The old extension and invite-link scheme in code that still accepts them
    # (`"trama" | "figcraft"`, `eq_ignore_ascii_case("figcraft")`): files and links made before
    # the rename keep working.
    '(?<=" \| ")figcraft(?=")',
    '(?<=\["trama", ")figcraft(?=")',
    '(?<=, "figcraft", ")FigCraft(?="\])',
    '(?<="TRAMA", ")figcraft(?=")',
    '(?<=eq_ignore_ascii_case\(")figcraft(?=")',
    # Credit for work done upstream.
    "FigCraft contributors",
    "colaboradores de FigCraft",
    "(?:(?<=began as )|(?<=nació como ))FigCraft",
    "ArtCraft Team",
    # Crafting hostile input in tests is not a product name.
    "Crafting hostile",
]

# Files left alone entirely.
skip = [
    ".github/rebrand.toml",
    "scripts/rebrand.py",
    # Licence notices keep upstream's copyright line, which the licences require.
    "NOTICE",
    "LICENSE-*",
    "licenses/*",
    # The record of what came from upstream.
    "docs/upstream.md",
]

# Run after renaming: shorter names change how rustfmt wraps lines and sorts imports.
after = [["cargo", "fmt", "--all"]]

# Lines that keep this app's value when upstream's tree is rebranded (the sync passes --pin-from).
[[pin]]
file = "Cargo.toml"
pattern = '^version = "[^"]*"'

# Identity: app id, publisher, installer identities (a product of its own, never FigCraft's).
[[replace]]
from = "ai.storyteller.figcraft"
to = "dev.danielmiguelt.Trama"

[[replace]]
from = "Learning Machines LLC"
to = "Nodalia"

[[replace]]
from = "7F8B9827-D065-41B7-A514-2A454B21F484"
to = "33A433A8-CFE1-4969-ACAD-171AAB11DE3E"

[[replace]]
from = "238228C3-4C1D-4B33-8C5D-C31B65BC2DA4"
to = "134AF699-C4C0-4398-AC50-E2AD3606A7B5"

# Online sharing has no default server: Trama depends on no service it does not run. Sharing on
# the local network works as before, and Preferences ▸ Server takes any server people run.
[[replace]]
from = 'None => "wss://collab.craftapps.dev/"'
to = 'None => ""'

# Shared crates come from getnodalia/foundation, which vendors them at the same commits.
[[replace]]
from = "https://github.com/storytold/craft-libs"
to = "https://github.com/getnodalia/foundation"

[[replace]]
from = "https://github.com/storytold/egui.git"
to = "https://github.com/getnodalia/foundation"

[[replace]]
from = "https://github.com/storytold/winit.git"
to = "https://github.com/getnodalia/foundation"

[[replace]]
from = "https://github.com/storytold/craft-fonts"
to = "https://github.com/getnodalia/foundation/tree/vendor/craft-fonts/main"

[[replace]]
from = "storytold/craft-fonts"
to = "getnodalia/foundation (vendor/craft-fonts/main)"

# Where the app lives: its repository, releases, container images and web page.
