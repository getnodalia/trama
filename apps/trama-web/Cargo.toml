[package]
name = "trama-web"
description = "Trama in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "trama-web"
path = "src/main.rs"

[dependencies]
trama-engine = { workspace = true }
trama-format = { workspace = true }
trama-ui-egui = { workspace = true }
trama-collab-net = { workspace = true }
trama-text = { workspace = true }
# The host messages (getnodalia/foundation (nodalia/libs)): one contract and one bridge for the web builds.
# The page command API (storytold/craft-libs#413): the request plumbing behind window.trama.
nodalia-web-api = { git = "https://github.com/getnodalia/foundation", rev = "f547adb35d48fcd26d3c67f4c23c8fc6b96255c9", version = "0.1.0" }
nodalia-web-host = { git = "https://github.com/getnodalia/foundation", rev = "f547adb35d48fcd26d3c67f4c23c8fc6b96255c9", version = "0.1.0" }
base64 = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "HtmlAnchorElement", "Node", "Blob", "BlobPropertyBag", "ClipboardEvent", "DataTransfer", "File", "FileList", "HtmlInputElement", "EventTarget", "Url", "Location", "MediaQueryList", "Navigator", "Gamepad", "GamepadButton", "GamepadMappingType", "Storage", "Event", "MessageEvent", "UrlSearchParams", "CustomEvent", "CustomEventInit"] }
