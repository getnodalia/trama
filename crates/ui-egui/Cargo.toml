[package]
name = "trama-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trama egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
nodalia-theme = { workspace = true, features = ["creator"] }
nodalia-ui = { workspace = true }
trama-geom = { workspace = true }
trama-color = { workspace = true }
trama-doc = { workspace = true }
trama-text = { workspace = true }
trama-layout = { workspace = true }
trama-render = { workspace = true }
trama-pathops = { workspace = true }
trama-engine = { workspace = true }
trama-format = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
egui_extras = { workspace = true }
web-time = "1.1.0"

[build-dependencies]
toml = "1"

[dev-dependencies]
wat = { workspace = true }
# Keep the test font features explicit; production uses the same bundled fallback faces.
# Dependency dev-features do not propagate into app release builds.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }

# The global menu (dbusmenu over the session bus) on Linux desktops with a top-bar menu. The zbus
# the portal file dialogs (rfd) and accesskit already bring.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nodalia-update = { workspace = true }
