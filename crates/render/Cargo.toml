[package]
name = "trama-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trama renderer: the scene graph to pixels on tiny-skia (fills, gradients, images, aligned strokes, shadows, blurs, masks, blend modes, text)"

[lints]
