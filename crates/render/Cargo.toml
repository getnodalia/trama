tiny-skia = { workspace = true }
image = { workspace = true }
moxcms = { workspace = true }
png = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
